name: CI

on:
  push:
    branches: [main]
    # A version tag runs the whole pipeline and then publishes the Docker
    # image and a GitHub Release (the Release job at the end).
    tags: ['v*']
  pull_request:
  # Also how the Tag job starts the release run for the tag it pushes.
  workflow_dispatch:

# Least privilege: jobs only need to read the repo unless they say otherwise.
permissions:
  contents: read

# Cancel superseded runs on the same PR/branch, but never on main so every
# commit there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Rules and target version live in ruff.toml. Pinned so a new ruff
      # release can't turn main red on its own; Dependabot doesn't bump it,
      # so raise it by hand now and then.
      - name: ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.20"
          args: check --output-format=github

      # hadolint reports DL3066 (USER by name, not UID) as info; the image's
      # kviss user has the fixed UID 1000, so only warnings and errors fail.
      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: shellcheck
        run: shellcheck scripts/*.sh

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11: Debian 12's python3, for the systemd + venv deploy.
        # 3.12: the Docker image (python:3.12-slim).
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: unittest
        run: python -m unittest discover -s tests -t . -v

  # Builds the image for the runner's platform and starts it the way
  # compose.yaml does (read-only root filesystem, no capabilities), so a
  # Dockerfile change that only breaks at runtime fails here, not on the server.
  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kviss:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name kviss -p 127.0.0.1:8000:8000 \
            -e KVISS_PASSWORD=ci \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            kviss:ci
          # The image's HEALTHCHECK only proves the app answers; wait for it.
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' kviss)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          docker logs kviss
          if [ "$status" != healthy ]; then
            echo "::error::Container never became healthy (status: $status)"
            exit 1
          fi
          # Without credentials the app must refuse; with them it must serve
          # the start page from the seeded database.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 401
          # The VERSION build arg must reach the footer.
          home=$(curl -fsS -u kviss:ci http://127.0.0.1:8000/)
          grep -q 'Kviss ci</footer>' <<<"$home"
          docker exec kviss test -f /data/kviss.db

  # Runs on pushes to main once everything else has passed. If the commits
  # since the last release ask for one (scripts/next-version.sh reads their
  # Conventional Commits subjects), it tags this commit and starts the release.
  #
  # A tag pushed with GITHUB_TOKEN doesn't trigger workflows, so the push
  # alone would never reach the Release job. workflow_dispatch is the one
  # event GITHUB_TOKEN may start, so the job dispatches this workflow on the
  # new tag: that run has github.ref = refs/tags/vX.Y.Z, exactly like a tag
  # pushed by hand.
  tag:
    name: Tag release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    # One at a time, so two quick merges can't compute the same version. A
    # queued run that GitHub replaces with a newer one loses nothing: the
    # newer run reads every commit since the last tag.
    concurrency:
      group: ${{ github.workflow }}-tag
      cancel-in-progress: false
    permissions:
      contents: write   # push the tag
      actions: write    # dispatch the release run
    steps:
      # Full history and tags (fetched now, after the concurrency wait, so a
      # tag the previous run pushed is seen).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          # Already released: tagged by hand, or a later commit's run got
          # here first and its tag covers this commit.
          if released=$(git tag --contains HEAD --list 'v*' | head -n 1) && [ -n "$released" ]; then
            echo "Already released in $released"
            exit 0
          fi
          version=$(scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Release: ${version:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Push tag and start release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          gh workflow run ci.yml --ref "$TAG"

  # Runs only for a v* tag, after everything else has passed. Publishes the
  # multi-arch image to GHCR and a GitHub Release pointing at it.
  #
  # Image tags for v1.2.3: 1.2.3, 1.2, 1 and latest. While on 0.x the bare
  # major tag is skipped (0 would float across breaking changes). A tag with
  # a hyphen (v0.2.0-rc.1) is a pre-release: it gets only its own version
  # tag, not latest, and the GitHub Release is marked as a pre-release.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: write     # create the release
      packages: write     # push to ghcr.io
      id-token: write     # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # arm64 too, for a Raspberry Pi or an ARM VPS. Everything in
      # requirements.txt ships arm64 wheels, so emulation only runs pip.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # value= because this run is usually a workflow_dispatch on the tag
          # (see the Tag job), not a tag push.
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }},enable=${{ !startsWith(github.ref_name, 'v0.') }}
          labels: |
            org.opencontainers.image.title=kviss
            org.opencontainers.image.description=Jeopardy-style quiz for game night

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image was built by this workflow from this commit:
      #   gh attestation verify oci://ghcr.io/sonhal/kviss:<version> --repo sonhal/kviss
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          cat > notes.md <<EOF
          ## Docker image

          \`\`\`bash
          docker pull $IMAGE:$VERSION
          \`\`\`

          Digest: \`$DIGEST\` (linux/amd64, linux/arm64)
          EOF
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file notes.md --generate-notes "${prerelease[@]}"
