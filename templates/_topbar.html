<header class="topbar">
  <h1>{{ quiz.title }}</h1>
  <nav>
    <button class="tool sound-toggle" type="button" hidden>🔊</button>
    {% if game.can_undo() %}
    <form method="post" action="{{ url_for('undo') }}"><button class="tool">↶ Angre</button></form>
    {% endif %}
    <a class="tool" href="{{ url_for('admin') }}">⚙</a>
  </nav>
</header>
