# docker compose up -d --build
# The database and audio files live in the named volume "kviss-data", mounted at /data.
# To use a folder on the host instead, see "Run with Docker" in README.md.
services:
  kviss:
    build: .
    image: kviss
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # only reachable from this host; put Caddy (HTTPS) in front
    environment:
      KVISS_PASSWORD: ${KVISS_PASSWORD:?set KVISS_PASSWORD in .env or the shell}
      KVISS_TZ: ${KVISS_TZ:-Europe/Oslo}
    volumes:
      - kviss-data:/data

volumes:
  kviss-data:
